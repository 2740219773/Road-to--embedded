<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMA Transfer Simulator</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px}.box{padding:20px;text-align:center;background:#253047;border-radius:9px}.arrow{font-size:28px}.bar{height:18px;background:#293246;border-radius:10px;overflow:hidden}.fill{height:100%;background:#d97706;width:0}button,select{font:inherit;padding:9px;margin:4px}@media(max-width:650px){.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}}</style></head><body><h1>DMA Transfer Simulator</h1><div class="card">Mode <select id="mode"><option value="poll">CPU Polling</option><option value="irq">Interrupt per byte</option><option value="dma" selected>DMA block transfer</option></select> <button onclick="run()">Run Transfer</button> <button onclick="resetAll()">Reset</button></div><div class="flow"><div class="box">Peripheral<br><b>16 bytes</b></div><div class="arrow">→</div><div class="box">DMA / CPU<br><b id="worker">DMA</b></div><div class="arrow">→</div><div class="box">Memory<br><b id="count">0 / 16</b></div></div><div class="card"><p>Transfer</p><div class="bar"><div id="transfer" class="fill"></div></div><p>Approx. CPU busy time</p><div class="bar"><div id="cpu" class="fill"></div></div><p id="explain"></p></div><script>let timer;function resetAll(){clearInterval(timer);transfer.style.width=cpu.style.width='0';count.textContent='0 / 16';explain.textContent='';worker.textContent=mode.value==='dma'?'DMA':'CPU'}function run(){resetAll();let i=0,m=mode.value;worker.textContent=m==='dma'?'DMA':'CPU';let busy=m==='poll'?100:m==='irq'?55:12;cpu.style.width=busy+'%';explain.textContent=m==='dma'?'CPU configures the transfer, then DMA moves the block; CPU can do other work until events such as half/complete.':m==='irq'?'CPU does not poll continuously, but frequent interrupts still consume execution time.':'CPU repeatedly participates in checking and moving data.';timer=setInterval(()=>{i++;transfer.style.width=(i/16*100)+'%';count.textContent=i+' / 16';if(i>=16)clearInterval(timer)},80)}mode.onchange=resetAll;resetAll();</script></body></html>
