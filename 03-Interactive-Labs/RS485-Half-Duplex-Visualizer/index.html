<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RS-485 Half-Duplex Visualizer</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}select,input{font:inherit;padding:8px;margin:4px}.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px}.box{padding:18px;text-align:center;background:#253047;border-radius:9px}.arrow{font-size:25px}.good{border-left:5px solid #15803d}.bad{border-left:5px solid #b91c1c}.mono{font-family:ui-monospace,monospace}.bus{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wire{padding:16px;background:#222a3a;border-radius:8px}@media(max-width:700px){.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.bus{grid-template-columns:1fr}}</style></head><body><h1>RS-485 Half-Duplex Visualizer</h1><div class="card">Direction <select id="dir"><option value="tx">MCU A sends</option><option value="rx">MCU A receives</option></select> <label>DE <input id="de" type="checkbox" checked></label> <label>Peer powered <input id="peer" type="checkbox" checked></label> <label>Termination/bias plausible <input id="term" type="checkbox" checked></label></div><div class="flow"><div id="mcu" class="box">MCU UART<br><b>TX/RX bytes</b></div><div class="arrow">→</div><div id="xcvr" class="box">RS-485 Transceiver<br><b id="state"></b></div><div class="arrow">→</div><div id="remote" class="box">Remote Node<br><b id="remoteState"></b></div></div><div class="card bus"><div class="wire mono" id="a"></div><div class="wire mono" id="b"></div></div><div class="card" id="result"></div><script>function draw(){let sending=dir.value==='tx',enabled=de.checked,p=peer.checked,t=term.checked;state.textContent=sending?(enabled?'Driver enabled':'Driver disabled'):'Receiver expected';remoteState.textContent=p?'Powered':'Offline';let active=sending&&enabled&&p&&t;if(sending){a.textContent='A/B differential bus: '+(enabled?'driver can create differential signal':'no driven differential signal');b.textContent='Direction control: DE='+Number(enabled)+' | UART TX may still toggle internally';result.textContent=active?'Physical transmit path is plausible. Next verify actual differential waveform and peer decode.':!enabled?'UART can send bytes internally while the RS-485 driver is disabled. Check DE/direction timing before blaming Modbus.':!p?'Local bus may toggle, but no powered peer can respond.':'Physical bus conditions are questionable; inspect wiring, termination/bias and differential waveform.'}else{a.textContent='A/B differential bus: remote node must drive a valid response';b.textContent='Local transceiver must be in receive-capable state';result.textContent=!p?'No peer response is possible because the remote node is offline.':!t?'A response may be distorted or idle state unstable; inspect physical bus conditions.':'Receive path is plausible. Verify remote response timing and local receiver/UART bytes.'}xcvr.className='box '+((sending&&enabled)||!sending?'good':'bad');remote.className='box '+(p?'good':'bad')}dir.onchange=de.onchange=peer.onchange=term.onchange=draw;draw();</script></body></html>
