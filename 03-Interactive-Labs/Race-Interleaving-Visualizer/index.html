<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Interleaving Visualizer</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}button{padding:9px 12px;margin:4px;border:0;border-radius:7px}.mono{font-family:ui-monospace,monospace}.state{font-size:20px}</style></head><body><h1>Race Interleaving Visualizer</h1><div class="card state">Shared counter = <b id="counter">0</b><br>A local = <b id="a">-</b> | B local = <b id="b">-</b></div><div class="card"><button onclick="readA()">A Read</button><button onclick="writeA()">A Write +1</button><button onclick="readB()">B Read</button><button onclick="writeB()">B Write +1</button><button onclick="resetAll()">Reset</button></div><div id="log" class="card mono">Try: A Read → B Read → A Write → B Write</div><script>let c=0,la=null,lb=null;function render(){counter.textContent=c;a.textContent=la===null?'-':la;b.textContent=lb===null?'-':lb}function add(x){log.innerHTML+= '<br>'+x}function readA(){la=c;add('A reads '+c);render()}function writeA(){if(la===null)return; c=la+1;add('A writes '+c);render()}function readB(){lb=c;add('B reads '+c);render()}function writeB(){if(lb===null)return;c=lb+1;add('B writes '+c);render()}function resetAll(){c=0;la=lb=null;log.textContent='Try: A Read → B Read → A Write → B Write';render()}render();</script></body></html>
