<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UART Frame Visualizer</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:15px 0}.frame{display:flex;gap:4px;align-items:stretch;overflow:auto}.bit{min-width:64px;padding:16px 5px;text-align:center;border-radius:6px;background:#293246}.start{background:#7f1d1d}.stop{background:#14532d}.data{background:#1e3a5f}input,select{padding:8px;font:inherit}.mono{font-family:ui-monospace,monospace}</style></head><body><h1>UART Frame Visualizer</h1><div class="card">Byte (0-255): <input id="byte" type="number" min="0" max="255" value="65"> Baud: <select id="baud"><option>9600</option><option selected>115200</option><option>921600</option></select></div><div id="frame" class="frame"></div><div class="card mono" id="info"></div><div class="card">UART 常见 8N1 帧：Idle=1 → Start=0 → 8 Data Bits（通常 LSB first）→ Stop=1。改变 Baud Rate 后，bit 内容不变，但每一 bit 持续时间会变化。</div><script>function draw(){let v=Math.max(0,Math.min(255,+byte.value||0)),b=+baud.value;let arr=[['Start',0,'start']];for(let i=0;i<8;i++)arr.push(['D'+i,(v>>i)&1,'data']);arr.push(['Stop',1,'stop']);frame.innerHTML=arr.map(x=>'<div class="bit '+x[2]+'"><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('');let us=1e6/b;info.textContent='0x'+v.toString(16).toUpperCase().padStart(2,'0')+' | '+v.toString(2).padStart(8,'0')+' | bit time ≈ '+us.toFixed(3)+' µs | 8N1 frame ≈ '+(us*10).toFixed(3)+' µs'}byte.oninput=baud.onchange=draw;draw();</script></body></html>
