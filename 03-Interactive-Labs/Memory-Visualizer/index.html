<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Visualizer</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#10131a;color:#eef2f7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card,.mem{background:#171c27;padding:18px;border-radius:10px}.row{display:grid;grid-template-columns:120px 1fr;padding:12px;border-bottom:1px solid #394150}.active{outline:2px solid #d97706}.arrow{font-size:28px;text-align:center}button{padding:10px 14px;margin:5px;border:0;border-radius:7px;cursor:pointer}.mono{font-family:ui-monospace,monospace}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Memory Visualizer</h1><p>观察变量、地址、指针和解引用之间的关系。</p><div class="grid"><div class="mem"><h2>Memory</h2><div id="v" class="row"><span class="mono">0x1000</span><span>value = <b id="value">10</b></span></div><div id="p" class="row"><span class="mono">0x1004</span><span>p = <b class="mono">0x1000</b></span></div></div><div class="card"><h2>Expressions</h2><p class="mono">value = <span id="evalue">10</span></p><p class="mono">&value = 0x1000</p><p class="mono">p = 0x1000</p><p class="mono">*p = <span id="deref">10</span></p><div class="arrow" id="action">p ─────→ value</div></div></div><p><button onclick="readP()">1. Read p</button><button onclick="deref()">2. Dereference *p</button><button onclick="write20()">3. *p = 20</button><button onclick="resetAll()">Reset</button></p><div class="card"><b>当前解释：</b><span id="explain">p 保存的是 value 的地址，而不是 value 的值。</span></div><script>let val=10;const V=document.getElementById('v'),P=document.getElementById('p');function clear(){V.classList.remove('active');P.classList.remove('active')}function sync(){value.textContent=evalue.textContent=deref().textContent}function render(){document.getElementById('value').textContent=val;document.getElementById('evalue').textContent=val;document.getElementById('deref').textContent=val}function readP(){clear();P.classList.add('active');explain.textContent='读取 p，得到地址 0x1000。';action.textContent='p → 0x1000'}function deref(){clear();V.classList.add('active');explain.textContent='根据 p 中的 0x1000 找到该内存位置，因此 *p 读取到 '+val+'。';action.textContent='*p → Memory[0x1000] → '+val;return document.getElementById('deref')}function write20(){clear();V.classList.add('active');val=20;render();explain.textContent='*p = 20 没有修改指针 p，而是把 p 指向的 0x1000 中的内容改成 20。';action.textContent='0x1000 ← 20'}function resetAll(){val=10;clear();render();action.textContent='p ─────→ value';explain.textContent='p 保存的是 value 的地址，而不是 value 的值。'}render();</script></body></html>
