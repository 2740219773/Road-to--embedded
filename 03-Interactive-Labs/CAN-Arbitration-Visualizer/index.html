<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAN Arbitration Visualizer</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}input,button{font:inherit;padding:8px}.bits{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:5px}.win{border-left:5px solid #15803d}.lose{border-left:5px solid #b91c1c}</style></head><body><h1>CAN Arbitration Visualizer</h1><div class="card">Node A ID 0x<input id="a" value="120" size="4"> Node B ID 0x<input id="b" value="080" size="4"> <button onclick="draw()">Arbitrate</button></div><div id="A" class="card"></div><div id="B" class="card"></div><div id="result" class="card"></div><script>function id(x){let v=parseInt(x,16);return Number.isFinite(v)?Math.max(0,Math.min(0x7ff,v)):0}function draw(){let av=id(a.value),bv=id(b.value),ab=av.toString(2).padStart(11,'0'),bb=bv.toString(2).padStart(11,'0'),winner=av===bv?'tie':av<bv?'A':'B',diff=-1;for(let i=0;i<11;i++)if(ab[i]!==bb[i]){diff=i;break}A.className='card '+(winner==='A'?'win':winner==='B'?'lose':'');B.className='card '+(winner==='B'?'win':winner==='A'?'lose':'');A.innerHTML='<b>Node A</b><div class="bits">'+ab+'</div>';B.innerHTML='<b>Node B</b><div class="bits">'+bb+'</div>';result.textContent=winner==='tie'?'IDs are equal; arbitration continues into following frame fields.':'Node '+winner+' wins. At first differing identifier bit '+diff+', dominant 0 overwrites recessive 1, so the node sending 1 detects the bus is 0 and stops transmitting.'}draw();</script></body></html>
