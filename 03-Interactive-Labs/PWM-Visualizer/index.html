<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PWM Visualizer</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:16px 0}input{width:100%}.wave{height:130px;width:100%;background:#0b0e14}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#202737;padding:12px;border-radius:8px}.mono{font-family:ui-monospace,monospace}</style></head><body><h1>PWM Visualizer</h1><div class="card"><label>Frequency: <b id="fv">1000</b> Hz</label><input id="f" type="range" min="100" max="5000" value="1000" step="100"><br><label>Duty Cycle: <b id="dv">50</b>%</label><input id="d" type="range" min="0" max="100" value="50"></div><canvas id="c" class="wave" width="900" height="130"></canvas><div class="stats"><div class="stat">Period<br><b id="period"></b></div><div class="stat">High Time<br><b id="high"></b></div><div class="stat">Average @3.3V<br><b id="avg"></b></div></div><div class="card mono">思考：改变 Frequency 时 Duty Cycle 一定变化吗？改变 Duty Cycle 时 Period 一定变化吗？先预测，再拖动滑块验证。</div><script>const f=document.getElementById('f'),d=document.getElementById('d'),ctx=c.getContext('2d');function draw(){let hz=+f.value,du=+d.value/100;fv.textContent=hz;dv.textContent=Math.round(du*100);let T=1/hz;period.textContent=(T*1000).toFixed(3)+' ms';high.textContent=(T*du*1000).toFixed(3)+' ms';avg.textContent=(3.3*du).toFixed(2)+' V';ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#eef2f7';ctx.lineWidth=3;ctx.beginPath();let cycles=5,w=c.width/cycles,yH=25,yL=105;ctx.moveTo(0,yL);for(let i=0;i<cycles;i++){let x=i*w,edge=x+w*du;ctx.lineTo(x,yL);ctx.lineTo(x,yH);ctx.lineTo(edge,yH);ctx.lineTo(edge,yL);ctx.lineTo(x+w,yL)}ctx.stroke()}f.oninput=d.oninput=draw;draw();</script></body></html>
