<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTOS Scheduler Timeline</title><link rel="stylesheet" href="../lab-foundation.css"><link rel="icon" href="data:,"><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}.row{display:grid;grid-template-columns:90px repeat(20,1fr);gap:2px;margin:5px 0}.cell{height:28px;background:#293246;border-radius:3px}.run{background:#d97706}.head{font-size:12px;text-align:center}input{width:55px;padding:5px}</style></head><body><h1>RTOS Scheduler Timeline</h1><div class="card"><label for="hp">High task period</label> <input id="hp" type="number" value="5" min="2" max="20"> ticks, <label for="he">execution</label> <input id="he" type="number" value="2" min="1" max="10"> ticks. Low task is always Ready. <button type="button" id="runBtn">Run</button></div><div id="timeline" class="card"></div><div id="info" class="card" role="status" aria-live="polite"></div><script>function draw(){let p=Math.max(2,+hp.value||5),e=Math.max(1,+he.value||1),high=[],low=[];for(let t=0;t<20;t++){let active=(t%p)<e;high.push(active);low.push(!active)}function row(name,a){return '<div class="row"><b>'+name+'</b>'+a.map((x,i)=>'<div class="cell '+(x?'run':'')+' head">'+i+'</div>').join('')+'</div>'}timeline.innerHTML=row('High',high)+row('Low',low);info.textContent=e>=p?'High-priority task requires at least its entire period and effectively starves Low in this simplified model.':'When High blocks/waits after its work, Low gets CPU time. Increase High execution time and observe how Low loses opportunities.'}document.getElementById('runBtn').addEventListener('click',draw);draw();</script></body></html>
