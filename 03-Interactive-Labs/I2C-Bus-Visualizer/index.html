<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I2C Bus Visualizer</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}.frame{display:flex;gap:5px;overflow:auto}.cell{min-width:78px;text-align:center;padding:14px 5px;border-radius:7px;background:#293246}.ack{background:#14532d}.nack{background:#7f1d1d}.start,.stop{background:#5b21b6}input{font:inherit;padding:7px}.bus{font-family:ui-monospace,monospace;font-size:18px;line-height:1.8}</style></head><body><h1>I²C Bus Visualizer</h1><div class="card">7-bit Address: 0x<input id="addr" value="50" size="3" maxlength="2"> <label><input id="powered" type="checkbox" checked> Device powered</label> <label><input id="pullup" type="checkbox" checked> Pull-up present</label></div><div id="frame" class="frame"></div><div class="card bus" id="bus"></div><div class="card" id="explain"></div><script>function draw(){let a=parseInt(addr.value,16);if(!Number.isFinite(a))a=0;a=Math.max(0,Math.min(127,a));let ok=powered.checked&&pullup.checked;let items=[['START','start'],['ADDR 0x'+a.toString(16).toUpperCase().padStart(2,'0'),''],['W=0',''],[ok?'ACK':'NACK',ok?'ack':'nack'],['DATA 0x2A',''],[ok?'ACK':'NACK',ok?'ack':'nack'],['STOP','stop']];frame.innerHTML=items.map(x=>'<div class="cell '+x[1]+'">'+x[0]+'</div>').join('');bus.textContent=pullup.checked?'SDA/SCL: released line can return HIGH':'SDA/SCL: no pull-up → released line cannot form a valid HIGH level';explain.textContent=!pullup.checked?'总线电气条件已经失败。先别分析地址和软件。':!powered.checked?'总线存在，但设备未工作，因此这里模拟 NACK。':'设备具备响应条件。注意：真实 NACK 还可能来自地址、时序、状态等多种原因。'}addr.oninput=powered.onchange=pullup.onchange=draw;draw();</script></body></html>
