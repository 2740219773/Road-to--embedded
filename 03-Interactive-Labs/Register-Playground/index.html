<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Playground</title><link rel="stylesheet" href="../lab-foundation.css"><link rel="icon" href="data:,"><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#10131a;color:#eef2f7}h1{margin-bottom:8px}.sub{color:#aab4c3}.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:28px 0}.bit{border:1px solid #4c566a;background:#1b2130;color:#fff;padding:16px 4px;border-radius:8px;cursor:pointer}.bit.on{background:#d97706}.values{font-family:ui-monospace,monospace;font-size:20px;line-height:1.8;background:#171c27;padding:18px;border-radius:10px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,input{font:inherit}button{padding:9px 12px;border:0;border-radius:7px;cursor:pointer}input{width:55px;padding:8px}.note{margin-top:25px;padding:14px;border-left:4px solid #94a3b8;background:#171c27}</style></head><body><h1>32-bit Register Playground</h1><p class="sub">点击任意 bit，观察二进制、十六进制和位运算之间的关系。</p><div id="bits" class="bits"></div><div class="values"><div>BIN: <span id="bin"></span></div><div>HEX: <span id="hex"></span></div><div>DEC: <span id="dec"></span></div></div><div class="controls">bit <input id="n" type="number" min="0" max="31" value="5"><button type="button" id="setBitBtn">Set |=</button><button type="button" id="clearBitBtn">Clear &= ~</button><button type="button" id="toggleBitBtn">Toggle ^=</button><button type="button" id="overwriteBtn">Overwrite =</button><button type="button" id="resetRegBtn">Reset</button><button type="button" id="randomRegBtn">Random</button></div><div class="values">Operation: <span id="op" role="status" aria-live="polite">reset</span></div><div class="note">挑战：先 Random，然后选择 bit5。分别点击 Overwrite 和 Set，观察为什么 <code>reg = (1U&lt;&lt;5)</code> 会清掉其他位，而 <code>reg |= (1U&lt;&lt;5)</code> 会保留它们。</div><script>let reg=0>>>0;const bits=document.getElementById('bits');for(let i=31;i>=0;i--){const b=document.createElement('button');b.className='bit';b.dataset.i=i;b.addEventListener('click',()=>{reg=(reg^(1<<i))>>>0;show('click bit '+i)});bits.appendChild(b)}function n(){return Math.max(0,Math.min(31,+document.getElementById('n').value||0))}function show(op){document.getElementById('bin').textContent=reg.toString(2).padStart(32,'0').replace(/(.{4})/g,'$1 ').trim();document.getElementById('hex').textContent='0x'+reg.toString(16).toUpperCase().padStart(8,'0');document.getElementById('dec').textContent=reg>>>0;document.getElementById('op').textContent=op;[...bits.children].forEach(x=>{let i=+x.dataset.i;x.textContent='b'+i+'\n'+((reg>>>i)&1);x.classList.toggle('on',!!((reg>>>i)&1))})}function mask(){return (1<<n())>>>0}function setBit(){reg=(reg|mask())>>>0;show('reg |= (1U << '+n()+')')}function clearBit(){reg=(reg&(~mask()))>>>0;show('reg &= ~(1U << '+n()+')')}function toggleBit(){reg=(reg^mask())>>>0;show('reg ^= (1U << '+n()+')')}function overwrite(){reg=mask();show('reg = (1U << '+n()+')')}function resetReg(){reg=0;show('reset')}function randomReg(){reg=(Math.random()*0x100000000)>>>0;show('random value')}document.getElementById('setBitBtn').addEventListener('click',setBit);document.getElementById('clearBitBtn').addEventListener('click',clearBit);document.getElementById('toggleBitBtn').addEventListener('click',toggleBit);document.getElementById('overwriteBtn').addEventListener('click',overwrite);document.getElementById('resetRegBtn').addEventListener('click',resetReg);document.getElementById('randomRegBtn').addEventListener('click',randomReg);show('reset');</script></body></html>
