<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPI Timing Playground</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}select{font:inherit;padding:8px}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.b{padding:15px 4px;text-align:center;border-radius:6px;background:#293246}.sample{outline:3px solid #d97706}.mono{font-family:ui-monospace,monospace}</style></head><body><h1>SPI Timing Playground</h1><div class="card">SPI Mode: <select id="mode"><option value="0">Mode 0 (CPOL0 CPHA0)</option><option value="1">Mode 1 (CPOL0 CPHA1)</option><option value="2">Mode 2 (CPOL1 CPHA0)</option><option value="3">Mode 3 (CPOL1 CPHA1)</option></select> Data: <select id="data"><option value="165">0xA5</option><option value="60">0x3C</option></select></div><div class="card"><div id="bits" class="timeline"></div></div><div class="card mono" id="info"></div><div class="card">橙色框表示本演示中的采样边沿对应数据位。重点不是背 Mode 0～3，而是理解 CPOL 决定空闲电平，CPHA 决定第几个有效边沿采样。</div><script>function draw(){let m=+mode.value,v=+data.value,cpol=m>>1,cpha=m&1;bits.innerHTML='';for(let i=7;i>=0;i--){let x=document.createElement('div');x.className='b sample';x.innerHTML='D'+i+'<br><b>'+((v>>i)&1)+'</b>';bits.appendChild(x)}let leading=cpol?'falling':'rising',trailing=cpol?'rising':'falling',sample=cpha?trailing:leading,shift=cpha?leading:trailing;info.textContent='CPOL='+cpol+' → clock idle '+(cpol?'HIGH':'LOW')+' | CPHA='+cpha+' → sample on '+sample+' edge, change on '+shift+' edge | MSB first'}mode.onchange=data.onchange=draw;draw();</script></body></html>
