<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modbus RTU Frame Builder</title><link rel="stylesheet" href="../lab-foundation.css"><link rel="icon" href="data:,"><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}input,button,select{font:inherit;padding:8px;margin:3px}.frame{font-family:ui-monospace,monospace;font-size:20px}.part{display:inline-block;padding:8px;border-radius:6px;background:#293246;margin:3px}.tag{font-size:12px;display:block;opacity:.75}.warn{border-left:5px solid #d97706}.good{border-left:5px solid #15803d}.mono{font-family:ui-monospace,monospace}</style></head><body><h1>Modbus RTU Frame Builder</h1><div class="card"><label for="slave">Slave</label> <input id="slave" type="number" min="1" max="247" value="1"> <label for="mode">Address input</label> <select id="mode"><option value="protocol">Protocol/PDU address</option><option value="manual">Manual 4xxxx display number</option></select> <label for="addr">Address</label> <input id="addr" value="0" size="8"> <label for="qty">Quantity</label> <input id="qty" type="number" min="1" max="125" value="2"> <button type="button" id="buildBtn">Build FC03</button></div><div id="mapping" class="card" role="status" aria-live="polite"></div><div id="frame" class="card frame"></div><div id="info" class="card" role="status" aria-live="polite"></div><script>function crc16(bytes){let crc=0xffff;for(const x of bytes){crc^=x;for(let i=0;i<8;i++)crc=(crc&1)?(crc>>1)^0xA001:crc>>1}return crc&0xffff}function h(x){return x.toString(16).toUpperCase().padStart(2,'0')}function part(x,label){return '<span class="part">'+h(x)+'<span class="tag">'+label+'</span></span>'}function draw(){let s=Math.max(1,Math.min(247,+slave.value||1)),q=Math.max(1,Math.min(125,+qty.value||1));let raw=(addr.value||'0').trim();let ad;if(mode.value==='manual'){let n=parseInt(raw,10);if(!Number.isFinite(n))n=40001;ad=n-40001;mapping.className='card warn';mapping.innerHTML='<b>Conventional example mapping</b><br>Manual display '+n+' → PDU address '+ad+'. This 40001→0 mapping is common for Holding Registers, but vendor/software conventions can differ. Always verify the actual manual/API convention.'}else{ad=/^0x/i.test(raw)?parseInt(raw,16):parseInt(raw,10);if(!Number.isFinite(ad))ad=0;mapping.className='card good';mapping.innerHTML='<b>Direct protocol address</b><br>PDU address = '+ad+' (0x'+Math.max(0,ad).toString(16).toUpperCase().padStart(4,'0')+').'}ad=Math.max(0,Math.min(65535,ad));let b=[s,3,(ad>>8)&255,ad&255,(q>>8)&255,q&255],c=crc16(b);frame.innerHTML=part(b[0],'Slave')+part(b[1],'FC03')+part(b[2],'Addr Hi')+part(b[3],'Addr Lo')+part(b[4],'Qty Hi')+part(b[5],'Qty Lo')+part(c&255,'CRC Lo')+part((c>>8)&255,'CRC Hi');info.innerHTML='<span class="mono">Protocol address='+ad+' | Quantity='+q+' | CRC=0x'+c.toString(16).toUpperCase().padStart(4,'0')+'</span><br><br>Frame bytes tell you what actually goes on the UART/RS-485 link. A manual label such as 40001 is not automatically the same numeric value as the two address bytes.'}mode.addEventListener('change',draw);slave.addEventListener('input',draw);addr.addEventListener('input',draw);qty.addEventListener('input',draw);document.getElementById('buildBtn').addEventListener('click',draw);draw();</script></body></html>
