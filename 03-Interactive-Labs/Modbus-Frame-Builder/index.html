<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modbus RTU Frame Builder</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}input,button{font:inherit;padding:8px;margin:3px}.frame{font-family:ui-monospace,monospace;font-size:22px;word-spacing:10px}.part{display:inline-block;padding:8px;border-radius:6px;background:#293246;margin:3px}</style></head><body><h1>Modbus RTU Frame Builder</h1><div class="card">Slave <input id="slave" type="number" min="1" max="247" value="1"> Start Address 0x<input id="addr" value="0000" size="5"> Quantity <input id="qty" type="number" min="1" max="125" value="2"> <button onclick="draw()">Build FC03</button></div><div id="frame" class="card frame"></div><div id="info" class="card"></div><script>function crc16(bytes){let crc=0xffff;for(const x of bytes){crc^=x;for(let i=0;i<8;i++)crc=(crc&1)?(crc>>1)^0xA001:crc>>1}return crc&0xffff}function h(x){return x.toString(16).toUpperCase().padStart(2,'0')}function draw(){let s=Math.max(1,Math.min(247,+slave.value||1)),ad=parseInt(addr.value,16)||0,q=Math.max(1,Math.min(125,+qty.value||1)),b=[s,3,(ad>>8)&255,ad&255,(q>>8)&255,q&255],c=crc16(b),all=[...b,c&255,(c>>8)&255];frame.innerHTML=all.map((x,i)=>'<span class="part">'+h(x)+'</span>').join('');info.textContent='Slave='+s+' | Function=03 Read Holding Registers | Protocol start address='+ad+' | Quantity='+q+' | CRC=0x'+c.toString(16).toUpperCase().padStart(4,'0')+'. 注意设备文档中的 40001 风格编号不一定等于报文地址字段，必须确认厂商地址约定。'}draw();</script></body></html>
