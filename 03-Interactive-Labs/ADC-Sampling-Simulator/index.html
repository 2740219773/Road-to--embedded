<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADC Sampling Simulator</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:36px auto;padding:0 18px;background:#10131a;color:#eef2f7}.card{background:#171c27;padding:18px;border-radius:10px;margin:14px 0}input{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.s{background:#222a3a;padding:14px;border-radius:8px}.mono{font-family:ui-monospace,monospace}</style></head><body><h1>ADC Sampling Simulator</h1><div class="card"><label>Input Voltage: <b id="vinv"></b> V</label><input id="vin" type="range" min="0" max="3300" value="1650"><label>Resolution: <b id="resv"></b> bit</label><input id="res" type="range" min="8" max="16" value="12"><label>Noise: ±<b id="noisev"></b> mV</label><input id="noise" type="range" min="0" max="100" value="0"></div><div class="stats"><div class="s">ADC Code<br><b id="code"></b></div><div class="s">LSB<br><b id="lsb"></b> mV</div><div class="s">Converted Voltage<br><b id="back"></b> V</div></div><div class="card mono" id="formula"></div><div class="card">拖动 Noise 后重复点击/拖动 Input，可以看到真实采样值为什么可能抖动。分辨率提高只会减小理想量化步长，并不会自动消除电源、参考源、布线或模拟噪声。</div><script>function draw(){let bits=+res.value,max=(2**bits)-1,ideal=+vin.value,ns=+noise.value,actual=Math.max(0,Math.min(3300,ideal+(Math.random()*2-1)*ns)),c=Math.round(actual/3300*max),bv=c/max*3.3;vinv.textContent=(ideal/1000).toFixed(3);resv.textContent=bits;noisev.textContent=ns;code.textContent=c+' / '+max;lsb.textContent=(3300/max).toFixed(4);back.textContent=bv.toFixed(4);formula.textContent='Code ≈ Vin / Vref × (2^N - 1), Vref = 3.300 V | sampled Vin ≈ '+(actual/1000).toFixed(4)+' V'}vin.oninput=res.oninput=noise.oninput=draw;draw();</script></body></html>
